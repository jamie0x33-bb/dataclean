[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataclean"
version = "0.2.1"
description = "Lightweight CSV data cleaning utility"
requires-python = ">=3.8"

[project.scripts]
dataclean = "dataclean.cli:main"

[tool.setuptools.packages.find]
include = ["dataclean*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
